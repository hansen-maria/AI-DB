services:
  # Vue.js frontend (configured with nginx)
  vue-app:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai-db-frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certbot-webroot:/var/www/certbot:ro
      - certbot-certs:/etc/letsencrypt:ro
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - app-network

  # Rust/Axum Backend
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai-db-api
    expose:
      - "8000"
    environment:
      - RUST_LOG=info
      - BAKTA_DB=/bakta-db
      - AI_DB_TEMP_DIR=/tmp-data
    volumes:
      - /mnt/bakta-db/db:/bakta-db:ro
      - /mnt/ai-db-tmp:/tmp-data
    restart: unless-stopped
    networks:
      - app-network

  # Certbot
  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - certbot-webroot:/var/www/certbot
      - certbot-certs:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    restart: unless-stopped
    networks:
      - app-network

volumes:
  certbot-webroot:
  certbot-certs:

networks:
  app-network:
    driver: bridge