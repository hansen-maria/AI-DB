name: Bug report
description: Something in AI-DB does not work as expected.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug!
        Please do **not** include unpublished sequence data you are not allowed to share.
        Security issues belong in a [private report](https://github.com/hansen-maria/AI-DB/security/advisories/new).

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Web interface
        - REST API
        - aidb CLI
        - Bakta / Baktfold integration
        - Psos integration
        - Export (TSV / JSON / FASTA / GFF3)
        - Functional analysis / charts
        - Self-hosted deployment (Docker)
        - Other
    validations:
      required: true

  - type: dropdown
    id: instance
    attributes:
      label: Where did it happen?
      options:
        - Public instance (ai-db.computational.bio)
        - Self-hosted instance
        - Local development setup
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Upload `proteins.faa` (sequence type: protein)
        2. Open the job and go to the Sequences tab
        3. Filter by "No match"
        4. ...
    validations:
      required: true

  - type: input
    id: job-id
    attributes:
      label: Job ID (optional)
      description: Shared jobs are read-only for others, so a Job ID helps us reproduce the issue. Never post your owner token.

  - type: textarea
    id: input-sample
    attributes:
      label: Minimal input (optional)
      description: A few FASTA records that trigger the problem, if you can share them.
      render: text

  - type: textarea
    id: logs
    attributes:
      label: Error messages or logs
      description: Browser console output, API responses, CLI output, or Docker logs.
      render: shell

  - type: input
    id: version
    attributes:
      label: Version
      description: Server version from `GET /api/health`, `aidb --version`, or the commit hash for self-hosted setups.

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser and OS, or OS and architecture for the CLI.
      placeholder: Firefox 133 on Ubuntu 24.04

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Screenshots or anything else that might help.
