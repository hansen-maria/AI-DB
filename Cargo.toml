[workspace]
resolver = "2"
members = [
    "backend",
    "crates/aidb-types",
    "crates/aidb-client",
    "crates/aidb-cli",
]
default-members = ["backend"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hansen-maria/AI-DB"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
utoipa = { version = "5.4.0", features = ["chrono"] }
aidb-types = { path = "crates/aidb-types" }
aidb-client = { path = "crates/aidb-client" }

# HTTP client (rustls: no OpenSSL needed, static builds for HPC nodes)
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4.5", features = ["derive", "env"] }
uuid = { version = "1", features = ["v4"] }
toml = "0.8"
directories = "6"
rpassword = "7"
tempfile = "3"
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
indicatif = "0.17"
flate2 = "1"

# Profiles only take effect at the workspace root
[profile.release]
lto = true
codegen-units = 1
opt-level = 3
panic = "abort"
strip = true
