[workspace]
resolver = "2"
members = [
    "backend",
    "crates/aidb-types",
    "crates/aidb-client",
    "crates/aidb-cli",
]
default-members = ["backend"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hansen-maria/AI-DB"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
utoipa = { version = "5.4.0", features = ["chrono"] }
aidb-types = { path = "crates/aidb-types" }
aidb-client = { path = "crates/aidb-client" }

# Profiles only take effect at the workspace root
[profile.release]
lto = true
codegen-units = 1
opt-level = 3
panic = "abort"
strip = true
